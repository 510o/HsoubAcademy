[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskaty"
version = "1.3.0"
description = "A simple CLI task manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "510o" }]

[project.scripts]
taskaty = "taskaty:main"

[tool.hatch.build.targets.wheel]
packages = ["taskaty"]